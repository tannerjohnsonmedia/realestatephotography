# Netlify deploy settings. Static site — nothing to build.
[build]
  publish = "."
  command = ""

# Long cache for fingerprint-stable assets; the HTML itself must stay fresh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Repo files that shouldn't be served as part of the site
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 301
