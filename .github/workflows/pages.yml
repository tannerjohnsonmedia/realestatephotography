# Publishes the site to GitHub Pages. This is a preview host — the production
# plan is Netlify on tannerjmedia.com (see README). The page's canonical tag
# already points at that domain, so this URL won't compete with it in search.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/real-estate-photography-landing-9q8g91]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
