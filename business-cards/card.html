<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FLNT Films business card</title>
<!--
  Source for the FLNT Films business card. Rendered to PDF with Chromium (see README.md).
  Page = US business card 3.5 x 2 in + 0.125 in bleed on every side = 3.75 x 2.25 in.
  Trim line is 0.125 in in from the page edge; all type stays at least 0.125 in inside the trim.
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0907;
    --text: #f2ece4;
    --muted: #a69e95;
    --ember: #ff5a1f;
    --paper: #f2ece4;
    --ink: #0b0907;
    --ink-muted: #5c544c;

    --bleed: 0.125in;
    --safe: 0.25in;          /* bleed + 0.125 in safety margin inside the trim */

    --font-display: "Archivo", "Arial Black", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @page { size: 3.75in 2.25in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card {
    position: relative;
    width: 3.75in; height: 2.25in;
    overflow: hidden;
    page-break-after: always; break-after: page;
  }
  .card:last-child { page-break-after: auto; break-after: auto; }

  .flame { fill: none; stroke: var(--ember); stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Front: the lockup, centred ---------- */
  .front { background: var(--bg); color: var(--text); display: grid; place-items: center; }
  .lockup-row { display: flex; align-items: center; gap: 0.16in; }
  .lockup-row .flame { width: 0.29in; height: 0.5in; stroke-width: 2.4; }
  .lockup { display: inline-grid; gap: 0.055in; }
  .lockup-flnt {
    font: 900 19pt/0.8 var(--font-display);
    font-stretch: 125%;
    letter-spacing: 0.08em;
    margin-right: -0.08em;
  }
  .lockup-films {
    display: flex; justify-content: space-between;
    font: 500 7pt/1 var(--font-mono);
    color: var(--muted);
  }

  /* ---------- Back: contact details on paper ---------- */
  .back {
    background: var(--paper); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr auto;
    padding: var(--safe) calc(var(--safe) + 0.04in);
  }
  .back-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .back-top .flame { width: 0.17in; height: 0.3in; stroke-width: 2.8; }
  .label {
    font: 500 5.75pt/1.4 var(--font-mono);
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-muted);
    text-align: right;
  }
  .contact { display: grid; gap: 0.045in; font: 500 8pt/1.2 var(--font-mono); letter-spacing: 0.02em; }
  .contact .name { font: 800 9.5pt/1 var(--font-display); font-stretch: 115%; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.06in; }
  .rule { width: 0.32in; height: 1.5px; background: var(--ember); margin-bottom: 0.1in; }
</style>
</head>
<body>

  <!-- Page 1: front -->
  <section class="card front" aria-label="Front">
    <div class="lockup-row">
      <svg class="flame" viewBox="6 1 36 62" aria-hidden="true">
        <path d="M28 3c-5 9-3 18 3 25c6 7 9 11 9 17a16 16 0 0 1-32 0c0-8 5-14 9-20c0 5 2 9 6 11c-2-8 0-22 5-33z" />
      </svg>
      <span class="lockup">
        <span class="lockup-flnt">FLNT</span>
        <span class="lockup-films"><span>F</span><span>I</span><span>L</span><span>M</span><span>S</span></span>
      </span>
    </div>
  </section>

  <!-- Page 2: back -->
  <section class="card back" aria-label="Back">
    <div class="back-top">
      <svg class="flame" viewBox="6 1 36 62" aria-hidden="true">
        <path d="M28 3c-5 9-3 18 3 25c6 7 9 11 9 17a16 16 0 0 1-32 0c0-8 5-14 9-20c0 5 2 9 6 11c-2-8 0-22 5-33z" />
      </svg>
      <p class="label" style="margin:0">Restaurant video<br />Denver, Colorado</p>
    </div>
    <div></div>
    <div class="contact">
      <span class="rule"></span>
      <span class="name">FLNT Films</span>
      <span>720.587.9516</span>
      <span>hello@flntfilms.com</span>
      <span>flntfilms.com</span>
    </div>
  </section>

</body>
</html>
